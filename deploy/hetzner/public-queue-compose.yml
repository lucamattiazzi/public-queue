# Install at /home/deploy/apps/public-queue-compose.yml.
services:
  public-queue:
    image: public-queue:personal-20260921
    build: ./public-queue
    restart: unless-stopped
    env_file: ./public-queue/.env
    expose:
      - "8787"
    volumes:
      - public-queue-data:/data
    networks:
      - web
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  web:
    external: true
    name: apps_web
volumes:
  public-queue-data:
